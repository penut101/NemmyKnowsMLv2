name: Database platform contract
on:
  push:
    branches: [main]
    paths: ['ops/database/**', 'sql/**', 'models/**/sql/**', 'models/nba/**', '.github/workflows/database-platform-ci.yml']
  pull_request:
    paths: ['ops/database/**', 'sql/**', 'models/**/sql/**', 'models/nba/**', '.github/workflows/database-platform-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fresh-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ops/database/requirements.txt
      - run: python -m pytest -q ops/database/tests
      - run: python ops/database/setup.py --local
      - name: Verify existing-schema and checksum safety
        run: python -m pytest -q ops/database/tests
        env:
          PLATFORM_TEST_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/postgres
      - run: python ops/database/validate.py --local
      - name: Verify shared callback separately
        env:
          PGPASSWORD: ci-only-password
        run: |
          createdb -h 127.0.0.1 -U postgres shared_contract
          psql -X -h 127.0.0.1 -U postgres -d shared_contract -v ON_ERROR_STOP=1 -f sql/tests/revalidation.sql
      - name: Verify repeat setup and immutable NBA history
        run: |
          python ops/database/setup.py --local
          python ops/database/validate.py --local
          cd models/nba
          python -m pytest -q tests/test_database.py
        env:
          NBA_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only-password@127.0.0.1:5432/postgres
