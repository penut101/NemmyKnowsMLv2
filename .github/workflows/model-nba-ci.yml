name: NBA model integrity
on:
  push:
    paths: ['models/nba/**', '.github/workflows/model-nba-ci.yml']
  pull_request:
    paths: ['models/nba/**', '.github/workflows/model-nba-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nba
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: nba
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nba" --health-interval 10s
          --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: models/nba
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: models/nba/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          NBA_TEST_DATABASE_URL: postgresql+psycopg://nba:ci-only-password@localhost:5432/nba
